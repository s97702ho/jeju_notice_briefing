name: Update Jeju Notice Briefing

on:
  schedule:
    # 평일 오전 8시 50분 (KST = 전일 23:50 UTC)
    - cron: '50 23 * * 0-4'
    # 평일 오전 10시 50분 ~ 오후 4시 50분 2시간마다 (KST = 01:50, 03:50, 05:50, 07:50 UTC)
    - cron: '50 1,3,5,7 * * 1-5'
    # 평일 오후 6시 20분 최종 (KST = 09:20 UTC)
    - cron: '20 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest notices and Do-bo
        run: python scripts/update_briefing.py --days 7

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefing_data.js
          if git diff --staged --quiet; then
            echo "변경된 내용이 없습니다."
          else
            git commit -m "chore: update jeju notice briefing data"
            git push
          fi
