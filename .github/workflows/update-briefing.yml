name: Update Jeju Notice Briefing

on:
  schedule:
    # 평일 오전 8시 37분 (KST = 전일 23:37 UTC) - 정시 트래픽 회피
    - cron: '37 23 * * 0-4'
    # 평일 오전 9시 12분 ~ 오후 6시 42분 30분마다 (KST = 00:12~09:42 UTC)
    - cron: '12,42 0-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest notices and Do-bo
        run: python scripts/update_briefing.py --days 3

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefing_data.js
          if git diff --staged --quiet; then
            echo "변경된 내용이 없습니다."
          else
            git commit -m "chore: update jeju notice briefing data"
            git push
          fi
