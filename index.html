<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제주 도시·개발 핵심 고시·공고 브리핑</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #1d4ed8;
      --jeju-do: #0f766e;
      --jeju-do-bg: #f0fdfa;
      --jeju-si: #1d4ed8;
      --jeju-si-bg: #eff6ff;
      --seogwipo: #7c3aed;
      --seogwipo-bg: #f5f3ff;
      --radius: 10px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      font-size: 14px;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 18px 28px;
    }

    .topbar {
      background: #0f172a;
      color: #ffffff;
      border-radius: var(--radius);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .topbar-left h1 {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 700;
    }

    .topbar-meta {
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .date-select {
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.28);
      background: #1e293b;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-amber { background: #d97706; color: #ffffff; }
    .btn-amber:hover { background: #b45309; }
    .btn-ghost { background: rgba(255,255,255,0.12); color: #ffffff; border-color: rgba(255,255,255,0.2); }
    .btn-ghost:hover { background: rgba(255,255,255,0.2); }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: #1e40af; }
    .btn-sm { padding: 4px 10px; font-size: 0.78rem; }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab-btn {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .search-input {
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.84rem;
      width: 240px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .badges {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .badge-do { background: var(--jeju-do-bg); color: var(--jeju-do); }
    .badge-si { background: var(--jeju-si-bg); color: var(--jeju-si); }
    .badge-sgp { background: var(--seogwipo-bg); color: var(--seogwipo); }
    .badge-tag { background: #dcfce7; color: #166534; }
    .badge-dobo { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

    .date {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .title {
      margin: 8px 0 0;
      font-size: 0.98rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.38;
    }

    .meta {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .summary {
      margin: 0;
      font-size: 0.84rem;
      color: #334155;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 3px solid #cbd5e1;
    }

    .card-foot {
      display: flex;
      justify-content: flex-end;
      padding-top: 2px;
    }

    /* 1개월 누적 아카이브 섹션 */
    .archive-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }

    .archive-header {
      padding: 12px 16px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-weight: 700;
      font-size: 0.92rem;
      color: #1e293b;
      border-bottom: 1px solid transparent;
    }

    .archive-box.open .archive-header {
      border-bottom-color: var(--border);
    }

    .archive-body {
      display: none;
      padding: 0;
    }

    .archive-box.open .archive-body {
      display: block;
    }

    .archive-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    .archive-table th,
    .archive-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    .archive-table th {
      background: #f8fafc;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.78rem;
    }

    .archive-table tr:last-child td {
      border-bottom: none;
    }

    .archive-table tr:hover td {
      background: #f8fafc;
    }

    .footer-note {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }

    .empty-box {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="topbar-left">
        <h1>제주 도시·개발 핵심 고시·공고 브리핑</h1>
        <div class="topbar-meta" id="headerSummary">불러오는 중...</div>
      </div>
      <div class="topbar-actions">
        <select id="dateSelect" class="date-select" aria-label="브리핑 날짜 선택"></select>
        <button type="button" id="forceRefreshBtn" class="btn btn-ghost" title="캐시를 무시하고 최신 데이터를 다시 불러옵니다">새로고침 ↻</button>
        <a class="btn btn-amber" href="https://www.jeju.go.kr/news/online/list/2014.htm" target="_blank" rel="noopener">제주특별자치도보(도보)</a>
        <a class="btn btn-ghost" href="https://www.jeju.go.kr/news/news/law/jeju2.htm" target="_blank" rel="noopener">도청 고시·공고</a>
      </div>
    </header>

    <section class="toolbar">
      <div class="tabs" id="agencyTabs"></div>
      <input type="search" id="searchInput" class="search-input" placeholder="키워드 검색 (민간특례, 재건축 등)..." />
    </section>

    <main id="grid" class="grid"></main>

    <section id="archiveBox" class="archive-box">
      <div class="archive-header" id="archiveToggle">
        <span id="archiveTitle">최근 1개월 내 고시·공고 (4 ~ 30일 전)</span>
        <span id="archiveArrow">펼쳐보기 ▼</span>
      </div>
      <div class="archive-body" id="archiveBody"></div>
    </section>

    <footer class="footer-note">
      <span><strong>선별 기준:</strong> 도시계획시설, 실시계획, 개발사업, 지구단위계획, 지형도면, 입지결정, 토지이용규제, 민간특례, 재개발·재건축</span>
      <span><strong>자동 업데이트:</strong> 평일 오전 8시 30분 ~ 오후 6시 30분 30분마다 자동 갱신</span>
    </footer>
  </div>

  <script>
    let allData = {};
    let dateKeys = [];
    let selectedDate = "";
    let selectedAgency = "ALL";
    let archiveOpen = false;

    const dateSelect = document.getElementById("dateSelect");
    const forceRefreshBtn = document.getElementById("forceRefreshBtn");

    function loadBriefingData(isManual = false) {
      if (isManual) {
        forceRefreshBtn.textContent = "불러오는 중...";
        forceRefreshBtn.disabled = true;
      }
      const oldScript = document.getElementById("briefingDataScript");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "briefingDataScript";
      script.src = `briefing_data.js?t=${Date.now()}`;
      script.onload = () => {
        allData = window.JEJU_BRIEFING_DATA || {};
        dateKeys = Object.keys(allData).sort().reverse();
        if (!selectedDate || !allData[selectedDate] || isManual) {
          selectedDate = dateKeys[0] || "";
        }
        initDateOptions();
        render();
        if (isManual) {
          forceRefreshBtn.textContent = "새로고침 ↻";
          forceRefreshBtn.disabled = false;
        }
      };
      script.onerror = () => {
        if (isManual) {
          forceRefreshBtn.textContent = "새로고침 ↻";
          forceRefreshBtn.disabled = false;
        }
      };
      document.body.appendChild(script);
    }

    function initDateOptions() {
      const options = dateKeys.map((k, idx) => {
        const suffix = idx === 0 ? " (최신)" : "";
        return `<option value="${k}">${allData[k].label}${suffix}</option>`;
      });
      options.push(`<option value="ALL_DATES">전체 누적 보기 (${dateKeys.length}일치)</option>`);
      dateSelect.innerHTML = options.join("");
      dateSelect.value = selectedDate;
    }

    function getCurrentNotices() {
      if (selectedDate === "ALL_DATES") {
        const merged = [];
        dateKeys.forEach(k => {
          (allData[k].notices || []).forEach(n => merged.push(n));
        });
        return merged;
      }
      return (allData[selectedDate] && allData[selectedDate].notices) || [];
    }

    function getArchiveNotices() {
      if (selectedDate === "ALL_DATES") {
        const latestKey = dateKeys[0];
        return (latestKey && allData[latestKey] && allData[latestKey].archiveNotices) || [];
      }
      return (allData[selectedDate] && allData[selectedDate].archiveNotices) || [];
    }

    function normalizeAgency(agency) {
      return agency === "제주특별자치도" ? "제주도청" : agency;
    }

    function badgeClass(agency) {
      const name = normalizeAgency(agency);
      if (name === "제주도청") return "badge-do";
      if (name === "제주시") return "badge-si";
      return "badge-sgp";
    }

    function tagBadgeClass(tag) {
      return (tag || "").includes("도보") ? "badge-dobo" : "badge-tag";
    }

    function getSeogwipoMgtNo(item) {
      const urlMatch = (item.url || "").match(/mgt_no=(\d+)/);
      if (urlMatch) return urlMatch[1];
      const sumMatch = (item.summary || "").match(/관리번호:\s*(\d+)/);
      return sumMatch ? sumMatch[1] : "";
    }

    function openSeogwipoDetail(mgtNo) {
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://eminwon.seogwipo.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do";
      form.target = "_blank";

      const fields = {
        jndinm: "OfrNotAncmtEJB",
        context: "NTIS",
        method: "selectOfrNotAncmt",
        methodnm: "selectOfrNotAncmtRegst",
        homepage_pbs_yn: "Y",
        subCheck: "N",
        not_ancmt_mgt_no: mgtNo
      };

      Object.entries(fields).forEach(([k, v]) => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = k;
        input.value = v;
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }

    function renderLinkBtn(item, label, extraClass = "") {
      if (normalizeAgency(item.agency) === "서귀포시") {
        const mgtNo = getSeogwipoMgtNo(item);
        if (mgtNo) {
          return `<button type="button" class="btn btn-primary ${extraClass}" onclick="openSeogwipoDetail('${mgtNo}')">${label}</button>`;
        }
      }
      return `<a class="btn btn-primary ${extraClass}" href="${item.url}" target="_blank" rel="noopener">${label}</a>`;
    }

    function renderTabs(baseList) {
      const counts = {
        "ALL": baseList.length,
        "제주도청": baseList.filter(i => normalizeAgency(i.agency) === "제주도청").length,
        "제주시": baseList.filter(i => i.agency === "제주시").length,
        "서귀포시": baseList.filter(i => i.agency === "서귀포시").length
      };

      const labels = [
        { key: "ALL", text: `전체 (${counts["ALL"]})` },
        { key: "제주도청", text: `제주도청 (${counts["제주도청"]})` },
        { key: "제주시", text: `제주시청 (${counts["제주시"]})` },
        { key: "서귀포시", text: `서귀포시청 (${counts["서귀포시"]})` }
      ];

      const tabsEl = document.getElementById("agencyTabs");
      tabsEl.innerHTML = labels.map(l => `
        <button class="tab-btn ${selectedAgency === l.key ? "active" : ""}" data-agency="${l.key}">
          ${l.text}
        </button>
      `).join("");

      tabsEl.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedAgency = btn.dataset.agency;
          render();
        });
      });

      const sgpText = counts["서귀포시"] === 0 ? "서귀포시 신규 관련 공고 없음" : `서귀포시 ${counts["서귀포시"]}건`;
      const targetKey = selectedDate === "ALL_DATES" ? dateKeys[0] : selectedDate;
      const updatedAt = (allData[targetKey] && allData[targetKey].updatedAt) ? ` · 마지막 업데이트: ${allData[targetKey].updatedAt}` : "";
      document.getElementById("headerSummary").textContent =
        `제주도청 ${counts["제주도청"]}건 · 제주시 ${counts["제주시"]}건 · ${sgpText}${updatedAt}`;
    }

    function filterList(list, q) {
      return list.filter(item => {
        const agencyName = normalizeAgency(item.agency);
        if (selectedAgency !== "ALL" && agencyName !== selectedAgency) return false;
        if (q) {
          const text = `${agencyName} ${item.tag} ${item.noticeNo} ${item.title} ${item.dept} ${item.summary}`.toLowerCase();
          if (!text.includes(q)) return false;
        }
        return true;
      });
    }

    function renderArchive(q) {
      const archiveBox = document.getElementById("archiveBox");
      const archiveTitle = document.getElementById("archiveTitle");
      const archiveArrow = document.getElementById("archiveArrow");
      const archiveBody = document.getElementById("archiveBody");

      const baseArchive = getArchiveNotices();
      const filteredArchive = filterList(baseArchive, q);

      archiveTitle.textContent = `최근 1개월 내 고시·공고 (4 ~ 30일 전 · ${filteredArchive.length}건)`;

      if (q && filteredArchive.length > 0) {
        archiveOpen = true;
      }

      archiveBox.classList.toggle("open", archiveOpen);
      archiveArrow.textContent = archiveOpen ? "접기 ▲" : "펼쳐보기 ▼";

      if (filteredArchive.length === 0) {
        archiveBody.innerHTML = `<div style="padding:18px; text-align:center; color:var(--muted); font-size:0.85rem;">해당 기간(4 ~ 30일 전) 조건에 맞는 공고가 없습니다.</div>`;
        return;
      }

      archiveBody.innerHTML = `
        <table class="archive-table">
          <thead>
            <tr>
              <th style="width:110px;">기관</th>
              <th style="width:140px;">구분</th>
              <th style="width:150px;">공고번호</th>
              <th>제목</th>
              <th style="width:130px;">담당부서</th>
              <th style="width:95px;">게시일</th>
              <th style="width:80px;">링크</th>
            </tr>
          </thead>
          <tbody>
            ${filteredArchive.map(item => `
              <tr>
                <td><span class="badge ${badgeClass(item.agency)}">${normalizeAgency(item.agency)}</span></td>
                <td><span class="badge ${tagBadgeClass(item.tag)}">${item.tag}</span></td>
                <td style="color:var(--muted); font-size:0.8rem;">${item.noticeNo}</td>
                <td style="font-weight:600;">${item.title}</td>
                <td style="color:var(--muted); font-size:0.8rem;">${item.dept}</td>
                <td style="color:var(--muted); white-space:nowrap;">${item.date}</td>
                <td>${renderLinkBtn(item, "원문", "btn-sm")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function render() {
      const baseList = getCurrentNotices();
      renderTabs(baseList);

      const grid = document.getElementById("grid");
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const filtered = filterList(baseList, q);

      if (filtered.length === 0) {
        const msg = selectedAgency === "서귀포시"
          ? "서귀포시청: 최근 3일간 도시계획·개발 관련 신규 공고 없음"
          : "조건에 해당하는 최근 3일 공고가 없습니다.";
        grid.innerHTML = `<div class="empty-box">${msg}</div>`;
      } else {
        grid.innerHTML = filtered.map(item => `
          <article class="card">
            <div>
              <div class="card-top">
                <div class="badges">
                  <span class="badge ${badgeClass(item.agency)}">${normalizeAgency(item.agency)}</span>
                  <span class="badge ${tagBadgeClass(item.tag)}">${item.tag}</span>
                </div>
                <span class="date">${item.date}</span>
              </div>
              <h2 class="title">${item.title}</h2>
              <div class="meta">${item.noticeNo} · ${item.dept}</div>
            </div>
            <p class="summary">${item.summary}</p>
            <div class="card-foot">
              ${renderLinkBtn(item, "원문 보기")}
            </div>
          </article>
        `).join("");
      }

      renderArchive(q);
    }

    document.getElementById("archiveToggle").addEventListener("click", () => {
      archiveOpen = !archiveOpen;
      render();
    });

    dateSelect.addEventListener("change", (e) => {
      selectedDate = e.target.value;
      render();
    });

    document.getElementById("searchInput").addEventListener("input", render);
    forceRefreshBtn.addEventListener("click", () => loadBriefingData(true));

    loadBriefingData(false);
  </script>
</body>
</html>
